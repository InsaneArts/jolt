title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Please search the answered questions first — many are already there.

        If Jolt is broken rather than unclear, [open a bug report](https://github.com/InsaneArts/jolt-app/issues/new/choose) instead.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you have tried
      description: Optional, and it usually saves a round trip.

  - type: input
    id: jolt-version
    attributes:
      label: Jolt version
      description: Only if the answer could depend on it.
      placeholder: 0.2.0 (92)
