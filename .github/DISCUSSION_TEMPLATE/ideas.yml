title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Half-formed is fine here. An idea that survives this thread can become a feature request.

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What Jolt would do, and when.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you are doing on your Mac when you want this, and what you do today instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Jolt
      options:
        - Menus (the app you are in)
        - Mac (apps, settings, actions)
        - Files
        - Web search
        - Actions of scriptable apps
        - Settings, the panel, or the keyboard
        - Something new
    validations:
      required: true
