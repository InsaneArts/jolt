name: Feature request
description: Something Jolt should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        If you are not yet sure what you want, [Discussions → Ideas](https://github.com/InsaneArts/jolt-app/discussions) is the better place to think it through.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, not the feature. What do you do on your Mac today to get it done?
      placeholder: |
        I switch between three Bluetooth outputs all day, and each switch is four clicks in Control Center.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What Jolt could do instead
      description: If you have a query in mind, write it out and write the row you would want back.
      placeholder: |
        "airpods" → Sound Output · AirPods Pro, and Return switches to it.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Jolt
      options:
        - Menus (the app you are in)
        - Mac (apps, settings, and actions)
        - The panel, the hotkey, or the keyboard
        - Something Jolt does not do at all
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Another app, a shortcut, a script — and what is wrong with it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and discussions and this is not one of them.
          required: true
